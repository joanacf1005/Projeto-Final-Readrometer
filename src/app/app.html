<app-header></app-header>
<main>
  @if (!isLoggedIn) {
    <div class="login-container">
      <h2>{{ registerMode ? 'Register' : 'Login' }}</h2>
      
      <input [(ngModel)]="username" placeholder="Username" class="form-input">
      <input [(ngModel)]="password" type="password" placeholder="Password" class="form-input">
      
      <div class="button-group">
        <button 
          type="button"
          (click)="registerMode ? createAccount() : login()"
          [disabled]="!username || !password">
          {{ registerMode ? 'Register' : 'Login' }}
        </button>
        <button type="button" (click)="toggleRegisterMode()">
          {{ registerMode ? 'Already have an account' : 'Create Account' }}
        </button>
      </div>
    </div>
  }

  @if (isLoggedIn) {
    <div class="logged-in">
      <p>Welcome{{ userNameDisplay }}!</p>
      <button type="button" (click)="logout()">Logout</button>
    </div>
    
    <router-outlet></router-outlet>
  }
</main>
<app-footer></app-footer>

name: Deploy Angular to GitHub Pages
on:
  push:
    branches: [ "feature/deploy" ]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm ci
      
      # Gera environments para Angular
      - name: Generate environment files
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: '${SUPABASE_URL}',
            supabaseKey: '${SUPABASE_KEY}'
          };
          EOF
          cat > src/environments/environment.development.ts <<EOF
          export const environment = {
            production: false,
            supabaseUrl: '${SUPABASE_URL}',
            supabaseKey: '${SUPABASE_KEY}'
          };
          EOF
      
      # Build Angular com base-href correto para GitHub Pages
      - name: Build Angular
        run: npm run build -- --base-href=./
      
      # Configura SPA routing + desativa Jekyll
      - name: Prepare GitHub Pages
        run: |
          cd /dist/readrometer/browser
          cp index.html 404.html
          sed -i 's|<base href="./">|<base href="/">|g' index.html
          touch .nojekyll
      
      # Deploy para gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/readrometer/browser
          publish_branch: gh-pages
          force_orphan: true



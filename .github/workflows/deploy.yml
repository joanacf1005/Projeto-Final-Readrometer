name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ "feature/deploy" ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4  # Fixed: v5 → v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Generate environment files
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.development.ts <<EOF
          export const environment = {
            production: false,
            supabaseUrl: '${SUPABASE_URL}',
            supabaseKey: '${SUPABASE_KEY}'
          };
          EOF
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: '${SUPABASE_URL}',
            supabaseKey: '${SUPABASE_KEY}'
          };
          EOF

      - name: Fazer o Build Angular
        run: npm run build -- --base-href=/Projeto-Final-Readrometer/

      - name: Ajustar index.html e 404 para GitHub Pages
        run: |
          cd ./dist/readrometer
          cp index.html 404.html

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4  
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/readrometer
          publish_branch: gh-pages

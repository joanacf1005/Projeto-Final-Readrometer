name: CI/CD - Build e Deploy Angular para GitHub Pages

on:
  push:
    branches: [ final-main ]
  pull_request:
    branches: [ final-main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate environment.ts
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.development.ts << EOF
          export const environment = {
            production: false,
            supabaseUrl: "${{ secrets.SUPABASE_URL }}",
            supabaseKey: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF

      - name: Run lint
        run: npm run lint

      - name: Build Angular app
        run: npx ng build --configuration production --output-path docs --base-href /Projeto-Final-Readrometer/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
name: CI & Deploy
on:
  pull_request:
    branches: [final-main]
  push:
    branches: [final-main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    - name: Generate environment.ts
      run: |
        mkdir -p src/environments
        cat > src/environments/environment.development.ts << EOF
        export const environment = {
          production: false,
          supabaseUrl: "${{ secrets.SUPABASE_URL }}",
          supabaseKey: "${{ secrets.SUPABASE_ANON_KEY }}"
        };
        EOF
    - run: npm run lint
    - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/final-main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: ci
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    - name: Generate environment.ts
      run: |
        mkdir -p src/environments
        cat > src/environments/environment.development.ts << EOF
        export const environment = {
          production: false,
          supabaseUrl: "${{ secrets.SUPABASE_URL }}",
          supabaseKey: "${{ secrets.SUPABASE_ANON_KEY }}"
        };
        EOF
    - run: npm run build
    - uses: actions/configure-pages@v4
    - uses: actions/upload-pages-artifact@v3
      with:
        path: 'dist/readrometer'
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
